<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор сдельно-премиальной зарплаты — Прототип</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Калькулятор сдельно-премиальной зарплаты</h1>
        
        <form id="calcForm">
            <div class="form-group">
                <label for="fio">ФИО работника:</label>
                <input type="text" id="fio" required placeholder="Иванов Пётр Князевич">
            </div>
            
            <div class="form-group">
                <label for="state">Должность:</label>
                <input type="text" id="state" required placeholder="Слесарь">
            </div>
            
            <div class="form-group">
                <label for="val">Расценка за единицу продукции:</label>
                <select id="val">
                    <option value="1000">Компрессор — 1000 руб.</option>
                    <option value="300">Вентилятор — 300 руб.</option>
                    <option value="500">Турбина — 500 руб.</option>
                    <option value="100">Сопло — 100 руб.</option>
                    <option value="200">Смеситель — 200 руб.</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="production">Изготовленная продукция (ед.):</label>
                <input type="number" id="production" required placeholder="100">
            </div>
            
            <div class="form-group">
                <label for="prize">Премия (руб.):</label>
                <input type="number" id="prize" required placeholder="1000">
            </div>
            
            <div class="form-group">
                <label for="count">Единица товара для премии (ед.):</label>
                <input type="number" id="count" required placeholder="5">
            </div>
            
            <div class="form-group">
                <label for="ndfl">НДФЛ (%):</label>
                <input type="number" id="ndfl" required placeholder="13" value="13">
            </div>
            
            <div class="form-group">
                <label for="normal">Норма (ед.):</label>
                <input type="number" id="normal" required placeholder="1">
            </div>
            
            <div class="form-group">
                <label for="location">Районный коэффициент:</label>
                <select id="location">
                    <option value="1.15">Республика Башкортостан — 1.15</option>
                    <option value="1.1">Ростовская область — 1.1</option>
                    <option value="1.2">Республика Дагестан — 1.2</option>
                    <option value="1.3">Республика Калмыкия — 1.3</option>
                    <option value="1.15">Ставропольский край — 1.15</option>
                </select>
            </div>
            
            <button type="button" onclick="calculate()">Рассчитать</button>
            <button type="reset">Очистить</button>
        </form>
        
        <div id="result" class="result" style="display:none;">
            <h2>Результат расчёта</h2>
            <p id="resultText"></p>
        </div>
    </div>
    
    <script>
        function calculate() {
            const fio = document.getElementById('fio').value;
            const e = parseFloat(document.getElementById('val').value);
            const c = parseFloat(document.getElementById('production').value);
            const pt = parseFloat(document.getElementById('prize').value);
            const nt = parseFloat(document.getElementById('count').value);
            const perc = parseFloat(document.getElementById('ndfl').value);
            const lt = parseFloat(document.getElementById('normal').value);
            const k = parseFloat(document.getElementById('location').value);
            const mrot = 12130;
            
            let m;
            if (nt > 0 && lt < c) {
                m = e * c + (c - lt) / nt * pt;
            } else {
                m = e * c;
            }
            
            let result;
            if (m < mrot) {
                result = mrot * k * (1 - perc / 100);
            } else {
                result = m * k * (1 - perc / 100);
            }
            
            document.getElementById('resultText').innerHTML = 
                `<strong>${fio}</strong>, ваша заработная плата составит: <strong>${result.toFixed(2)} руб.</strong>`;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
